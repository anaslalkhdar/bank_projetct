server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
          routes:
            - id: r1
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**
            - id: r2
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/products/**
            - id: r3
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/bills/**

management:
  endpoints:
    web:
      exposure:
        include: health
